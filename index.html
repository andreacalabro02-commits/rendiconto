<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Sabaoth">
<title>Sabaoth – Rendiconto</title>
<style>
:root{--blu:#2c5d9b;--navy:#14264a;--crema:#f7efdc;--verde:#1d6b34;--rosso:#a52a2a;--grigio:#6b7385}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#162038;background:#e9edf5}
body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:#fff;font-variant-numeric:tabular-nums}
header{padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(#fff,#f8f3e6);border-bottom:1px solid #e6dfcb}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--grigio)}
.top b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff}
.top b svg{width:20px;height:20px}
h1{font:700 20px/1.2 Georgia,"Times New Roman",serif;color:var(--navy);margin:8px 0 0;text-align:center;letter-spacing:.05em}
main{flex:1;overflow-y:auto;padding:0 16px 24px}
h2{font:700 24px Georgia,"Times New Roman",serif;color:var(--navy);margin:18px 0 10px}
.chips{display:flex;gap:8px;position:sticky;top:0;z-index:2;background:#fff;padding:6px 0 12px}
.chips button{flex:1;padding:10px 4px;border:1px solid #d5dbea;border-radius:999px;background:#fff;color:var(--navy);font-family:inherit;font-size:14px;font-weight:600;transition:.2s}
.chips button.on{background:var(--blu);border-color:var(--blu);color:#fff;box-shadow:0 6px 14px -6px #2c5d9b99}
.seg{display:flex;background:#e6e9f1;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:11px;border:0;border-radius:11px;background:none;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--navy);transition:.2s}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 4px 10px -4px #14264a99}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;border:1px solid #e8ebf3;border-left:5px solid var(--blu);box-shadow:0 8px 20px -10px #14264a55}
.card h3{margin:0 0 10px;font:700 15px Georgia,"Times New Roman",serif;letter-spacing:.06em;color:var(--navy);text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:16px;border-bottom:1px dashed #e4e7f0}
.row span:last-child{font-weight:600;white-space:nowrap}
.row small{display:block;font-weight:400;font-size:13px;color:var(--grigio)}
.tot{font-weight:700;border-bottom:0;padding-top:8px}
.in,.out{padding:6px 10px;border-radius:8px;font-weight:700;font-size:14px;letter-spacing:.06em;margin:10px 0 4px}
.in{background:#d3ebd8;color:var(--verde)}.out{background:#f8d6d6;color:var(--rosso)}
.g{color:var(--verde)}.r{color:var(--rosso)}
.cassa{display:flex;align-items:center;gap:18px;border-radius:20px;padding:20px 22px;margin-bottom:16px;box-shadow:0 12px 24px -14px #14264a88}
.cassa span{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:#ffffffb0;font-size:32px}
.cassa small{display:block;font-size:13px;font-weight:700;letter-spacing:.16em;color:#4b5568}
.cassa b{font:700 38px Georgia,"Times New Roman",serif;color:var(--navy)}
.big{background:linear-gradient(160deg,#fbf4e0,#f0e2bd);border:1px solid #e6d6a8;text-align:center;padding:22px}
.big h3{color:#5b4b1e}
.big b{display:block;font:700 50px Georgia,"Times New Roman",serif;color:var(--verde);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:6px 4px;color:var(--grigio);font-weight:600;font-size:12.5px}
td{padding:8px 4px;border-top:1px solid #edf0f6}
tr:nth-child(even) td{background:#f8f9fc}
td:nth-child(3),th:nth-child(3){text-align:right;padding-right:8px}
.leg{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--grigio);margin-top:6px}.leg i{width:10px;height:10px;border-radius:3px}.leg i:not(:first-child){margin-left:12px}
#lock{display:none;position:fixed;inset:0;z-index:9;background:#fff;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:340px;text-align:center}
#lock h2{margin-top:0}
#lock input{width:100%;padding:14px;font-size:17px;border:1px solid #d5dbea;border-radius:12px;margin:10px 0}
#lock button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-family:inherit;font-size:17px;font-weight:700}
#lerr{color:var(--rosso);margin-top:10px;min-height:20px;font-size:14px}
.dx{text-align:right;line-height:1.5}#esci{display:none;color:var(--blu);font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer}
.vuoto,.msg{color:var(--grigio);text-align:center;padding:22px 8px;font-size:14px}
nav{display:flex;gap:2px;background:var(--crema);padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e6dfcb}
nav button{flex:1;border:0;background:none;padding:7px 0 5px;border-radius:16px;font-family:inherit;font-size:11px;color:var(--grigio);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
nav button span{display:flex}nav button svg{width:24px;height:24px}
nav button.on{background:var(--navy);color:#fff;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="top"><b id="ico"></b><span class="dx"><span id="oggi"></span><br><a id="esci" onclick="esci()">Esci</a></span></div>
  <h1>SABAOTH, REGGIO CALABRIA</h1>
</header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="lock"><form onsubmit="entra();return false"><h2>SABAOTH</h2><p>Inserisci la password per entrare.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button>Entra</button><div id="lerr"></div></form></div>

<script>
/* ================== CONFIGURAZIONE ==================
   Incolla qui i 3 link CSV di Google Sheets
   (File → Condividi → Pubblica sul web → scegli il foglio → CSV).
   Se lasci vuoto, l'app mostra dati di esempio. */
const API = "https://script.google.com/macros/s/AKfycbws3aiTWs6lm1zX4xwWtiB4qWAMlFqKUP61qn67h_rMxwVdver4zR3fCGn8mtNsn0xiNw/exec";  // indirizzo dell'app web di Apps Script (con la password). Vuoto = non usato.
const ANNI = [2025, 2026, 2027]; // anni mostrati nei pulsanti (quelli senza dati restano vuoti)
const REFRESH_MS = 60000; // riletura automatica ogni 60 secondi
/* ==================================================== */

const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const S=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PAGES=[["home",S('<path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/>'),"Home"],["dom",S('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),"Domeniche"],["men",S('<path d="M3 20h18M6 16l4-5 3 3 5-7"/>'),"Mensile"],["ver",S('<path d="M12 3v18M6.5 8.5h11"/>'),"Decima"],["are",S('<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'),"Aree"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{let s=String(v??"").replace(/[€$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s)||0};
const eur=n=>n.toLocaleString("it-IT",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2,useGrouping:"always"})+" €";
const dt=s=>{let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],m[2]-1,+m[1]):null};
const sum=a=>a.reduce((t,x)=>t+x.v,0);
const group=(a,f)=>{const o={};a.forEach(x=>{const k=f(x)||"Altro";o[k]=(o[k]||0)+x.v});return Object.entries(o)};
const det=L=>L.map(m=>`<div class="row"><span>${esc(m.categoria||"Uscita")}${m.nota?`<small>${esc(m.nota)}</small>`:""}</span><span>${eur(m.v)}</span></div>`).join("");
const lines=g=>g.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${eur(v)}</span></div>`).join("");

function leggi(r,key){r=r.map(x=>x.map(c=>String(c??"").trim())).filter(x=>x.some(Boolean));const i=r.findIndex(x=>x.some(c=>c.toLowerCase()==key));if(i>0)r.splice(0,i);const h=(r.shift()||[]).map(s=>s.toLowerCase());return r.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||""])))}
function mese(v){const s=String(v??"").trim();let m=s.match(/^(\d{4})-(\d{2})/);if(m)return{y:+m[1],m:+m[2]-1};m=s.match(/^(\S+)\s+(\d{4})/);const i=m?MESI.findIndex(x=>x.toLowerCase()==m[1].toLowerCase()):-1;return i<0?null:{y:+m[2],m:i}}
/* Trasforma i 5 fogli di Google Sheets (righe e colonne grezze) nei dati usati dall'app */
function build(R){
  const B={cassa:[],mov:[],ver:[],mens:{},are:[]};
  const c=R.cassa||[];(c[0]||[]).forEach((h,i)=>{if(String(h).trim())B.cassa.push({n:String(h).trim(),v:num(c[1]&&c[1][i])})});
  const d=R.domeniche||[],h=(d[1]||[]).map(x=>String(x).replace(/\s+/g," ").trim().toLowerCase()),ix=s=>h.indexOf(s);
  const EN=[["decima (contanti)","Decima","Contanti"],["offerta (contanti)","Offerta","Contanti"],["decima (pos)","Decima","POS"],["offerta (pos)","Offerta","POS"]].map(([k,a,b])=>[ix(k),a,b]);
  const iu=ix("contanti"),inn=ix("note");
  d.slice(2).forEach(r=>{const x=dt(String(r[0]));if(!x)return;
    if(EN.some(([i])=>i>=0&&String(r[i]).trim()!==""))EN.forEach(([i,a,b])=>i>=0&&B.mov.push({d:x,e:true,v:num(r[i]),categoria:a,metodo:b,nota:""}));
    const u=iu>=0?num(r[iu]):0,nt=inn>=0?String(r[inn]).trim():"";
    if(u||nt)B.mov.push({d:x,e:false,v:u,categoria:"Uscite (contanti)",metodo:"",nota:nt})});
  const m=R.mensile||[],hr=m.findIndex(r=>r.some(c=>/^(entrate|uscite|decime|offerte)\s+\d{4}$/i.test(String(c).trim())));
  if(hr>=0)m[hr].forEach((c,j)=>{const k=String(c).trim().toLowerCase().match(/^(entrate|uscite|decime|offerte)\s+(\d{4})$/);if(!k)return;
    const Y=(B.mens[k[2]]??={entrate:[],uscite:[],decime:[],offerte:[]});
    for(let i=0;i<12;i++){const v=(m[hr+1+i]||[])[j];Y[k[1]][i]=v===""||v==null?null:num(v)}});
  Object.values(B.mens).forEach(Y=>{Y.entrate=Array.from({length:12},(_,i)=>Y.entrate[i]??((Y.decime[i]!=null||Y.offerte[i]!=null)?(Y.decime[i]||0)+(Y.offerte[i]||0):null))});
  leggi(R.decima||[],"mese").forEach(x=>x.mese&&!/total/i.test(x.mese)&&B.ver.push({...x,v:num(x.importo)}));
  const a=R.aree||[],ah=a.findIndex(r=>String(r[0]).trim().toLowerCase()=="mese");
  if(ah>=0)a.slice(ah+1).forEach(r=>{const p=mese(r[0]);if(!p)return;const vals=[];
    a[ah].forEach((n,i)=>{const t=String(n).trim();if(i&&t&&String(r[i]).trim()!=="")vals.push([t,num(r[i])])});B.are.push({...p,vals})});
  return B;
}
/* ---- dati di esempio (usati solo se gli URL sono vuoti) ---- */
const DEMO=()=>{
  const R=(i,a,b)=>Math.round(a+((i*7919)%1000)/1000*b),f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const mm=[["","Entrate 2025","Entrate 2026","Uscite 2025","Uscite 2026","Decime 2025","Decime 2026","Offerte 2025","Offerte 2026"]];
  for(let i=0;i<12;i++)mm.push([MESI[i].slice(0,3),"",i<9?"":"",R(i+5,2500,2000),i<9?R(i+7,2500,2000):"",R(i+2,2000,600),i<9?R(i+4,1800,900):"",R(i+1,600,500),i<9?R(i+6,700,800):""]);
  const dom=[["Data","Entrate"],["","Decima (Contanti)","Offerta (Contanti)","TOTALE (Contanti)","Decima (POS)","Offerta (POS)","TOTALE (POS)","TOTALE (GENERALE)","","Data","CONTANTI","","Note","","TOTALE (GENERALE)"]];
  for(let k=0;k<14;k++){const d=new Date(2026,10,1-7*k);dom.push([f(d),R(k,100,400),R(k+1,150,100),0,R(k+2,50,200),R(k+3,10,60),0,0,"",f(d),k%3==0?R(k,20,300):0,"",k%3==0?"Spese varie e pulizie":"","",0])}
  const dec=[["Anno","Mese","Importo","Stato","Note"]];
  for(let y=2025;y<=2026;y++)for(let i=0;i<12;i++)if(y==2025||i<10)dec.push([y,MESI[i],i%4==2?"":R(i,150,400),y==2026&&i==9?"In Attesa":"Pagata",i%4==2?"Conguagliato":""]);
  return{cassa:[["Contanti","Spicci","Dollari"],[1350,117.22,56]],domeniche:dom,mensile:mm,decima:dec,
    aree:[["Mese","Libreria","Saints","Bar"],["Ottobre 2026",120,300,15],["Novembre 2026","","",""]]};
};
let D={cassa:[],mov:[],ver:[],mens:{},are:[]},page=location.hash.slice(1)||"home",year=ANNI.includes(new Date().getFullYear())?new Date().getFullYear():ANNI[ANNI.length-1],tab="E",ok=true;
if(!PAGES.some(p=>p[0]==page))page="home";


const store={get:()=>{try{return localStorage.getItem("sb_pw")||""}catch(e){return""}},set:v=>{try{localStorage.setItem("sb_pw",v)}catch(e){}}};
function lock(msg){$("#lock").style.display="flex";$("#lerr").textContent=msg||""}
let PW="",errTxt="";
function esci(){PW="";store.set("");D={cassa:[],mov:[],ver:[],mens:{},are:[]};$("#pw").value="";lock("");view()}
async function entra(){
  const v=$("#pw").value.trim();if(!v)return;
  const b=$("#lock button");b.disabled=true;b.textContent="Controllo…";$("#lerr").textContent="";
  PW=v;store.set(v);await refresh();
  b.disabled=false;b.textContent="Entra";
}
async function fetchAll(){
  if(!API)return DEMO();
  const pw=PW||store.get();let j;
  try{j=await(await fetch(API+"?p="+encodeURIComponent(pw))).json()}catch(e){throw new Error("connessione assente o risposta non valida")}
  if(!j.ok){if(j.errore)throw new Error("Google: "+j.errore);PW="";store.set("");lock(pw?"Password errata.":"");throw 0}
  $("#lock").style.display="none";
  return j.data;
}
async function refresh(){
  try{D=build(await fetchAll());ok=true;errTxt=""}catch(e){ok=false;errTxt=e&&e.message?e.message:""}
  if(errTxt&&$("#lock").style.display=="flex")$("#lerr").textContent="Errore: "+errTxt;
  view();
}

/* ---- viste ---- */
const years=()=>ANNI;
const chips=()=>`<div class="chips">${years().map(y=>`<button class="${y==year?"on":""}" onclick="setYear(${y})">ANNO ${y}</button>`).join("")}</div>`;
const vuoto=t=>`<div class="vuoto">${t}</div>`;

function home(){
  const st={Contanti:["#cdeee6","💶","€"],Spicci:["#f4dfbd","🪙","€"],Dollari:["#cfe2f7","💲","$"]};
  return `<h2>Disponibilità Cassa Attuale</h2>`+(D.cassa.map(c=>{const s=st[c.n]||["#eee","💰","€"];
    const val=s[2]=="$"?"$ "+c.v.toLocaleString("it-IT"):eur(c.v);
    return `<div class="cassa" style="background:${s[0]}"><span>${s[1]}</span><div><small>${esc(c.n.toUpperCase())}</small><b>${val}</b></div></div>`}).join("")||vuoto("Nessun dato in cassa."));
}
function dom(){
  const e=tab=="E",by={};
  D.mov.filter(m=>m.d.getFullYear()==year&&m.d.getDay()==0&&m.e==e).forEach(m=>(by[+m.d]??=[]).push(m));
  const keys=Object.keys(by).sort((a,b)=>b-a);
  return `<h2>Rendiconto Domenicale</h2>`+chips()+andDom()+
   `<div class="seg"><button class="${e?"on":""}" onclick="setTab('E')">ENTRATE</button><button class="${e?"":"on"}" onclick="setTab('U')">USCITE</button></div>`+
   (keys.map(k=>{const L=by[k],d=new Date(+k);
    return `<div class="card"><h3>${d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</h3>${e?lines(group(L,m=>[m.categoria,m.metodo].filter(Boolean).join(" "))):det(L)}<div class="row tot"><span>TOTALE ${e?"ENTRATA":"USCITA"} DOMENICALE</span><span>${eur(sum(L))}</span></div></div>`}).join("")||vuoto("Nessun movimento domenicale per questo anno."));
}
function men(){
  const M=D.mens[year],out=[];
  if(M)for(let i=0;i<12;i++){
    const E=M.entrate[i],U=M.uscite[i],Dc=M.decime[i],Of=M.offerte[i];
    if([E,U,Dc,Of].every(x=>x==null))continue;
    const te=E||0,tu=U||0,s=te-tu;
    out.push(`<div class="card"><h3>${MESI[i]} ${year}</h3><div class="in">ENTRATE ↗</div>${lines([["Decima",Dc||0],["Offerta",Of||0]])}<div class="row tot g"><span>TOTALE ENTRATE</span><span>${eur(te)}</span></div><div class="out">USCITA ↘</div><div class="row tot r"><span>TOTALE USCITE</span><span>-${eur(tu)}</span></div><div class="row tot ${s<0?"r":"g"}"><span>SALDO DEL MESE</span><span>${s<0?"":"+"}${eur(s)}</span></div></div>`);
  }
  return `<h2>Rendiconto Mensile</h2>`+chips()+andamento()+decOff()+(out.join("")||vuoto("Nessun dato per questo anno."));
}
function ver(){
  const L=D.ver.filter(x=>x.anno==year),ic=s=>/pagat/i.test(s)?"✅":/attesa/i.test(s)?"⚠️":"❌";
  return `<h2>Decima Milano</h2>`+chips()+
   `<div class="card big"><h3>Totale anno ${year}</h3><b>${eur(sum(L.filter(x=>/pagat/i.test(x.stato))))}</b></div>`+
   (L.length?`<div class="card"><h3>Tabella versamenti</h3><table><tr><th>Mese</th><th>Stato</th><th>Importo</th><th>Nota</th></tr>${L.map(x=>`<tr><td>${esc(x.mese)}</td><td>${x.stato?ic(x.stato)+" "+esc(x.stato):"—"}</td><td>${x.importo===""?"—":eur(x.v)}</td><td>${esc(x.note)||"—"}</td></tr>`).join("")}</table></div>`:vuoto("Nessun versamento per questo anno."));
}
function are(){
  const out=D.are.filter(a=>a.y==year&&a.vals.length).sort((a,b)=>b.m-a.m).map(a=>`<div class="card"><h3>${MESI[a.m]} ${year}</h3>${lines(a.vals)}<div class="row tot g" style="justify-content:flex-end;gap:8px;border-top:1px solid #0003;margin-top:6px;padding-top:6px">TOTALE AREE: ${eur(a.vals.reduce((t,[,v])=>t+v,0))}</div></div>`);
  return `<h2>Riepilogo aree</h2>`+chips()+(out.join("")||vuoto("Nessun dato per questo anno."));
}
function grafico(t,lab,E,U){
  if(!E.some(Boolean)&&!U.some(Boolean))return"";
  const n=lab.length,st=330/n,w=Math.min(10,st*.4),mx=Math.max(...E,...U),k=Math.ceil(n/12),
  r=(v,x,c)=>`<rect x="${x}" y="${130-v/mx*120}" width="${w}" height="${v/mx*120}" rx="1.5" fill="${c}"/>`;
  return `<div class="card"><h3>${t}</h3><svg viewBox="0 0 340 150" width="100%">${lab.map((l,i)=>{const x=8+i*st+(st-2*w-1)/2;return r(E[i],x,"#2e8b4a")+r(U[i],x+w+1,"#c0392b")+(i%k?"":`<text x="${x+w+.5}" y="146" text-anchor="middle" font-size="8.5" fill="#6b7385">${l}</text>`)}).join("")}<line x1="6" x2="336" y1="130" y2="130" stroke="#d5dbea"/></svg><div class="leg"><i style="background:#2e8b4a"></i>Entrate<i style="background:#c0392b"></i>Uscite</div></div>`;
}
function andamento(){const M=D.mens[year];if(!M)return"";const z=a=>Array.from({length:12},(_,i)=>a[i]||0);return grafico(`Andamento ${year}`,MESI.map(m=>m.slice(0,3)),z(M.entrate),z(M.uscite))}
function andDom(){
  const by={};D.mov.filter(m=>m.d.getFullYear()==year&&m.d.getDay()==0).forEach(m=>(by[+m.d]??=[]).push(m));
  const k=Object.keys(by).sort((a,b)=>a-b),d=k.map(x=>new Date(+x));
  return grafico(`Andamento domeniche ${year}`,d.map(x=>x.getDate()+"/"+(x.getMonth()+1)),k.map(x=>sum(by[x].filter(m=>m.e))),k.map(x=>sum(by[x].filter(m=>!m.e))));
}
function decOff(){
  const M=D.mens[year];if(!M)return"";
  const Dc=Array.from({length:12},(_,i)=>M.decime[i]||0),Of=Array.from({length:12},(_,i)=>M.offerte[i]||0);
  if(!Dc.some(Boolean)&&!Of.some(Boolean))return"";
  const mx=Math.max(...Dc.map((v,i)=>v+Of[i])),st=330/12,w=18,r=(v,y0,c,x)=>`<rect x="${x}" y="${130-(y0+v)/mx*120}" width="${w}" height="${v/mx*120}" fill="${c}"/>`;
  return `<div class="card"><h3>Decime e offerte ${year}</h3><svg viewBox="0 0 340 150" width="100%">${Dc.map((v,i)=>{const x=8+i*st+(st-w)/2;return r(v,0,"#2c5d9b",x)+r(Of[i],v,"#d9a520",x)+`<text x="${x+w/2}" y="146" text-anchor="middle" font-size="8.5" fill="#6b7385">${MESI[i].slice(0,3)}</text>`}).join("")}<line x1="6" x2="336" y1="130" y2="130" stroke="#d5dbea"/></svg><div class="leg"><i style="background:#2c5d9b"></i>Decime<i style="background:#d9a520"></i>Offerte</div></div>`;
}
function view(){
  $("#v").innerHTML=(API?"":`<div class="msg">Dati di esempio: collega il tuo Google Sheet (riga API all'inizio del file).</div>`)+
    (ok?"":`<div class="msg r">Impossibile aggiornare i dati. Mostro gli ultimi disponibili.${errTxt?"<br><small>"+esc(errTxt)+"</small>":""}</div>`)+({home,dom,men,ver,are}[page])();
  $("#nav").innerHTML=PAGES.map(p=>`<button class="${p[0]==page?"on":""}" onclick="go('${p[0]}')"><span>${p[1]}</span>${p[2]}</button>`).join("");
  $("#ico").innerHTML=PAGES.find(p=>p[0]==page)[1];
}
const go=p=>{page=p;location.hash=p;view();$("#v").scrollTop=0};
const setYear=y=>{year=y;view()};
const setTab=t=>{tab=t;view()};
function clock(){const n=new Date();$("#oggi").textContent="Oggi: "+n.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})+" - "+n.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}

clock();if(API)$("#esci").style.display="inline";setInterval(clock,30000);
refresh();setInterval(()=>{if(!document.hidden)refresh()},REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
</script>
</body>
